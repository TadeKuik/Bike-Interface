<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spoke — Bike Dashboard</title>

<!-- Early theme set to avoid a flash of the wrong theme -->
<script>
(function(){
  try{
    var saved = localStorage.getItem('spoke_theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>

<meta name="theme-color" content="#14181A" id="theme-color-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spoke">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A minimal speed, time and distance dashboard for your bike.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314181A'/%3E%3Cpath d='M50 22a28 28 0 1 1 -19.8 47.8' stroke='%23FF6A3D' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23FF6A3D'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314181A'/%3E%3Cpath d='M50 22a28 28 0 1 1 -19.8 47.8' stroke='%23FF6A3D' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23FF6A3D'/%3E%3C/svg%3E">
<link id="manifest-link" rel="manifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #F2F4F2;
    --ink: #12181A;
    --muted: #5B6663;
    --line: rgba(18,24,26,0.12);
    --chip-bg: rgba(18,24,26,0.06);
    --accent: #FF6A3D;
    --accent-ink: #14100D;
    --font-display: 'Big Shoulders Display', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  [data-theme="dark"]{
    --bg: #14181A;
    --ink: #EDF1EE;
    --muted: #8B958F;
    --line: rgba(237,241,238,0.14);
    --chip-bg: rgba(237,241,238,0.08);
    --accent: #FF7A4D;
    --accent-ink: #14100D;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    transition: background .2s ease, color .2s ease;
  }
  button{ font-family: inherit; color: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  #app{
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 18px);
  }

  /* ---------- top bar ---------- */
  .topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .clock{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.4rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .topbar-actions{ display: flex; gap: 6px; }
  .icon-btn{
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-radius: 10px;
    cursor: pointer;
    color: var(--muted);
  }
  .icon-btn:hover{ background: var(--chip-bg); color: var(--ink); }
  .icon-btn svg{ width: 20px; height: 20px; }

  /* ---------- hero speed ---------- */
  .hero{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    gap: 2px;
  }
  .speed-value{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(5.5rem, 32vw, 12rem);
    line-height: 0.82;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .speed-value.stale{ color: var(--muted); }
  .unit-toggle{
    background: none;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 18px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--muted);
    cursor: pointer;
    margin-top: 6px;
  }
  .unit-toggle:hover{ border-color: var(--accent); color: var(--ink); }
  .gps-hint{
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
    max-width: 240px;
  }

  /* ---------- stats row ---------- */
  .stats{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    flex-shrink: 0;
  }
  .stat{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 0 6px;
  }
  .stat:not(:first-child){ border-left: 1px solid var(--line); }
  .stat-label{
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stat-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .stat-dot.live{ background: var(--accent); }
  .stat-value{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.7rem;
    font-variant-numeric: tabular-nums;
  }
  .stat-btn{
    background: none; border: none; cursor: pointer; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }

  /* ---------- chips row ---------- */
  .chips{
    display: flex;
    gap: 8px;
    justify-content: center;
    padding-top: 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .chip{
    background: var(--chip-bg);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    font-family: var(--font-body);
    cursor: default;
  }
  .chip.tappable{ cursor: pointer; }
  .chip.tappable:hover{ color: var(--ink); }
  .chip b{ color: var(--ink); font-weight: 600; }

  /* ---------- more panel ---------- */
  .panel{
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--ink);
    transform: translateX(100%);
    transition: transform .32s cubic-bezier(.4,0,.2,1);
    z-index: 20;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 18px);
  }
  .panel.open{ transform: translateX(0); }
  @media (prefers-reduced-motion: reduce){ .panel{ transition: none; } }

  .panel-header{
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    margin-bottom: 8px;
  }
  .panel-title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.3rem;
  }
  .panel-body{ overflow-y: auto; flex: 1; padding-bottom: 20px; }

  .section-title{
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin: 22px 0 8px;
  }
  .section-title:first-child{ margin-top: 6px; }

  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .row-label{ font-size: 0.95rem; }
  .row-sub{ font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .row-value{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.15rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .segmented{
    display: flex;
    background: var(--chip-bg);
    border-radius: 100px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button{
    background: none; border: none; cursor: pointer;
    padding: 6px 14px; border-radius: 100px;
    font-size: 0.85rem; font-weight: 600;
    color: var(--muted);
  }
  .segmented button.active{ background: var(--accent); color: var(--accent-ink); }

  .switch{
    position: relative; width: 42px; height: 25px;
    background: var(--chip-bg); border-radius: 100px;
    border: none; cursor: pointer; flex-shrink: 0;
  }
  .switch::after{
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 19px; height: 19px; border-radius: 50%;
    background: var(--muted);
    transition: transform .18s ease, background .18s ease;
  }
  .switch.on{ }
  .switch.on::after{ transform: translateX(17px); background: var(--accent); }

  .small-btn{
    background: none;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .small-btn:hover{ color: var(--ink); border-color: var(--accent); }

  .empty-note{
    color: var(--muted);
    font-size: 0.88rem;
    padding: 10px 0;
  }

  ::-webkit-scrollbar{ width: 0; height: 0; }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="clock" id="clock">--:--</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="resetBtn" aria-label="Reset ride" title="Reset ride">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="moreBtn" aria-label="More" title="More">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>
  </div>

  <div class="hero">
    <div class="speed-value stale" id="speedValue">0</div>
    <button class="unit-toggle" id="unitToggle">km/h</button>
    <div class="gps-hint" id="gpsHint">Waiting for GPS — go outside and allow location access</div>
  </div>

  <div class="stats">
    <div class="stat">
      <button class="stat-btn" id="timerBtn">
        <span class="stat-label"><span class="stat-dot" id="timerDot"></span>Timer</span>
        <span class="stat-value" id="timerValue">0:00</span>
      </button>
    </div>
    <div class="stat">
      <span class="stat-label">Distance</span>
      <span class="stat-value" id="distValue">0.00</span>
    </div>
    <div class="stat">
      <span class="stat-label">Avg speed</span>
      <span class="stat-value" id="avgValue">0</span>
    </div>
  </div>

  <div class="chips">
    <div class="chip"><span>Max</span><b id="maxChip">0 km/h</b></div>
    <div class="chip" id="battChip" style="display:none"><span>🔋</span><b id="battValue">--%</b></div>
    <button class="chip tappable" id="compassChip">Compass off</button>
  </div>
</div>

<div class="panel" id="panel" aria-hidden="true">
  <div class="panel-header">
    <button class="icon-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="panel-title">More</div>
  </div>
  <div class="panel-body">

    <div class="section-title">World clock</div>
    <div id="worldClockList"></div>

    <div class="section-title">Ride log</div>
    <div id="rideLogList"></div>

    <div class="section-title">Settings</div>
    <div class="row">
      <div class="row-label">Units</div>
      <div class="segmented" id="unitSeg">
        <button data-val="km">km</button>
        <button data-val="mi">mi</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">Clock format</div>
      <div class="segmented" id="clockSeg">
        <button data-val="24">24h</button>
        <button data-val="12">12h</button>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="row-label">Keep screen on</div>
        <div class="row-sub">Prevents the phone from sleeping while riding</div>
      </div>
      <button class="switch" id="wakeSwitch"></button>
    </div>
    <div class="row">
      <div>
        <div class="row-label">Compass</div>
        <div class="row-sub">Shows heading direction on the main screen</div>
      </div>
      <button class="small-btn" id="compassBtn">Enable</button>
    </div>
    <div class="row" style="border-bottom:none">
      <div>
        <div class="row-label">Theme</div>
      </div>
      <div class="segmented" id="themeSeg">
        <button data-val="light">Light</button>
        <button data-val="dark">Dark</button>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  'use strict';

  /* ============ state ============ */
  var state = {
    unit: localStorage.getItem('spoke_unit') || 'km',
    clockFormat: localStorage.getItem('spoke_clockformat') || '24',
    theme: document.documentElement.getAttribute('data-theme') || 'light',
    wakeLockOn: localStorage.getItem('spoke_wakelock') !== 'off',
    compassEnabled: false
  };

  var ride = {
    distanceM: 0,
    movingSeconds: 0,
    maxSpeedMs: 0,
    timerRunning: false,
    lastGoodFix: null,
    lastFixTime: null,
    speedBuffer: [],
    autoMoveTimeout: null
  };

  var wakeLock = null;

  /* ============ elements ============ */
  var el = {
    clock: document.getElementById('clock'),
    speedValue: document.getElementById('speedValue'),
    unitToggle: document.getElementById('unitToggle'),
    gpsHint: document.getElementById('gpsHint'),
    timerValue: document.getElementById('timerValue'),
    timerDot: document.getElementById('timerDot'),
    timerBtn: document.getElementById('timerBtn'),
    distValue: document.getElementById('distValue'),
    avgValue: document.getElementById('avgValue'),
    maxChip: document.getElementById('maxChip'),
    battChip: document.getElementById('battChip'),
    battValue: document.getElementById('battValue'),
    compassChip: document.getElementById('compassChip'),
    resetBtn: document.getElementById('resetBtn'),
    themeBtn: document.getElementById('themeBtn'),
    moreBtn: document.getElementById('moreBtn'),
    backBtn: document.getElementById('backBtn'),
    panel: document.getElementById('panel'),
    worldClockList: document.getElementById('worldClockList'),
    rideLogList: document.getElementById('rideLogList'),
    unitSeg: document.getElementById('unitSeg'),
    clockSeg: document.getElementById('clockSeg'),
    themeSeg: document.getElementById('themeSeg'),
    wakeSwitch: document.getElementById('wakeSwitch'),
    compassBtn: document.getElementById('compassBtn'),
    themeColorMeta: document.getElementById('theme-color-meta')
  };

  /* ============ helpers ============ */
  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function msToDisplaySpeed(ms){
    return state.unit === 'km' ? ms * 3.6 : ms * 2.23694;
  }
  function metersToDisplayDist(m){
    return state.unit === 'km' ? m / 1000 : m / 1609.344;
  }
  function unitLabel(){ return state.unit === 'km' ? 'km/h' : 'mph'; }
  function distUnitLabel(){ return state.unit === 'km' ? 'km' : 'mi'; }

  /* ============ clock ============ */
  function renderClock(){
    var now = new Date();
    el.clock.textContent = formatTime(now, state.clockFormat);
  }
  function formatTime(date, fmt){
    var h = date.getHours();
    var m = pad(date.getMinutes());
    if(fmt === '12'){
      var ampm = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12; if(h12 === 0) h12 = 12;
      return h12 + ':' + m + ' ' + ampm;
    }
    return pad(h) + ':' + m;
  }

  var WORLD_CITIES = [
    { name: 'Los Angeles', tz: 'America/Los_Angeles' },
    { name: 'New York', tz: 'America/New_York' },
    { name: 'London', tz: 'Europe/London' },
    { name: 'Berlin', tz: 'Europe/Berlin' },
    { name: 'Dubai', tz: 'Asia/Dubai' },
    { name: 'Tokyo', tz: 'Asia/Tokyo' },
    { name: 'Sydney', tz: 'Australia/Sydney' }
  ];
  function renderWorldClock(){
    var now = new Date();
    el.worldClockList.innerHTML = WORLD_CITIES.map(function(c){
      var opts = { hour: '2-digit', minute: '2-digit', hour12: state.clockFormat === '12', timeZone: c.tz };
      var t = new Intl.DateTimeFormat('en-GB', opts).format(now);
      return '<div class="row"><div class="row-label">' + c.name + '</div><div class="row-value">' + t + '</div></div>';
    }).join('');
  }

  /* ============ timer ============ */
  function formatDuration(sec){
    sec = Math.floor(sec);
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if(h > 0) return h + ':' + pad(m) + ':' + pad(s);
    return m + ':' + pad(s);
  }
  function setTimerRunning(running){
    ride.timerRunning = running;
    el.timerDot.classList.toggle('live', running);
  }
  function toggleTimerManual(){
    setTimerRunning(!ride.timerRunning);
    clearTimeout(ride.autoMoveTimeout);
  }

  /* ============ ride log ============ */
  function loadLog(){
    try{ return JSON.parse(localStorage.getItem('spoke_rides') || '[]'); }
    catch(e){ return []; }
  }
  function saveLog(log){ localStorage.setItem('spoke_rides', JSON.stringify(log)); }
  function logCurrentRide(){
    if(ride.distanceM < 150) return;
    var log = loadLog();
    var avgMs = ride.movingSeconds > 0 ? (ride.distanceM / ride.movingSeconds) : 0;
    log.unshift({
      date: new Date().toISOString(),
      distanceM: ride.distanceM,
      movingSeconds: ride.movingSeconds,
      avgMs: avgMs,
      maxMs: ride.maxSpeedMs
    });
    if(log.length > 25) log = log.slice(0, 25);
    saveLog(log);
  }
  function renderRideLog(){
    var log = loadLog();
    if(log.length === 0){
      el.rideLogList.innerHTML = '<div class="empty-note">No rides saved yet — they appear here after you reset a ride.</div>';
      return;
    }
    var html = log.map(function(r){
      var d = new Date(r.date);
      var dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      var dist = metersToDisplayDist(r.distanceM).toFixed(2) + ' ' + distUnitLabel();
      var avg = Math.round(msToDisplaySpeed(r.avgMs)) + ' ' + unitLabel();
      return '<div class="row"><div><div class="row-label">' + dateStr + '</div>' +
             '<div class="row-sub">' + dist + ' · ' + formatDuration(r.movingSeconds) + '</div></div>' +
             '<div class="row-value">' + avg + '</div></div>';
    }).join('');
    html += '<button class="small-btn" id="clearLogBtn" style="margin-top:12px">Clear log</button>';
    el.rideLogList.innerHTML = html;
    var clearBtn = document.getElementById('clearLogBtn');
    if(clearBtn) clearBtn.addEventListener('click', function(){
      saveLog([]);
      renderRideLog();
    });
  }

  /* ============ reset ============ */
  function resetRide(){
    logCurrentRide();
    ride.distanceM = 0;
    ride.movingSeconds = 0;
    ride.maxSpeedMs = 0;
    ride.lastGoodFix = null;
    ride.speedBuffer = [];
    setTimerRunning(false);
    clearTimeout(ride.autoMoveTimeout);
    renderStats(0);
    renderRideLog();
  }

  /* ============ speed / geolocation ============ */
  function renderStats(instMs){
    el.speedValue.textContent = Math.round(msToDisplaySpeed(instMs));
    el.distValue.textContent = metersToDisplayDist(ride.distanceM).toFixed(2);
    var avgMs = ride.movingSeconds > 0 ? (ride.distanceM / ride.movingSeconds) : 0;
    el.avgValue.textContent = Math.round(msToDisplaySpeed(avgMs));
    el.maxChip.textContent = Math.round(msToDisplaySpeed(ride.maxSpeedMs)) + ' ' + unitLabel();
    el.timerValue.textContent = formatDuration(ride.movingSeconds);
  }

  function handlePosition(pos){
    var c = pos.coords;
    var now = pos.timestamp || Date.now();
    el.gpsHint.style.display = 'none';
    el.speedValue.classList.remove('stale');

    var instMs = 0;
    if(typeof c.speed === 'number' && c.speed !== null && c.speed >= 0){
      instMs = c.speed;
    } else if(ride.lastGoodFix){
      var dt = (now - ride.lastFixTime) / 1000;
      if(dt > 0){
        var d = haversine(ride.lastGoodFix.lat, ride.lastGoodFix.lon, c.latitude, c.longitude);
        instMs = d / dt;
      }
    }

    ride.speedBuffer.push(instMs);
    if(ride.speedBuffer.length > 4) ride.speedBuffer.shift();
    var smoothMs = ride.speedBuffer.reduce(function(a,b){ return a+b; }, 0) / ride.speedBuffer.length;

    var goodAccuracy = !c.accuracy || c.accuracy < 25;

    if(goodAccuracy){
      if(ride.lastGoodFix){
        var dist = haversine(ride.lastGoodFix.lat, ride.lastGoodFix.lon, c.latitude, c.longitude);
        if(dist > 1 && dist < 200){
          ride.distanceM += dist;
        }
      }
      ride.lastGoodFix = { lat: c.latitude, lon: c.longitude };
      ride.lastFixTime = now;
      if(smoothMs > ride.maxSpeedMs && smoothMs < 45) ride.maxSpeedMs = smoothMs;
    }

    var kmh = smoothMs * 3.6;
    if(kmh > 3){
      clearTimeout(ride.autoMoveTimeout);
      setTimerRunning(true);
    } else if(ride.timerRunning){
      if(!ride.autoMoveTimeout){
        ride.autoMoveTimeout = setTimeout(function(){
          setTimerRunning(false);
          ride.autoMoveTimeout = null;
        }, 8000);
      }
    }

    renderStats(smoothMs);
  }

  function handleGeoError(){
    el.gpsHint.textContent = 'Location unavailable — check permissions and GPS signal';
    el.gpsHint.style.display = 'block';
  }

  function startGeo(){
    if(!('geolocation' in navigator)){
      el.gpsHint.textContent = 'This browser has no location support';
      return;
    }
    navigator.geolocation.watchPosition(handlePosition, handleGeoError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 8000
    });
  }

  /* timer ticking (independent of GPS fix rate) */
  setInterval(function(){
    if(ride.timerRunning){
      ride.movingSeconds += 1;
      el.timerValue.textContent = formatDuration(ride.movingSeconds);
      var avgMs = ride.movingSeconds > 0 ? (ride.distanceM / ride.movingSeconds) : 0;
      el.avgValue.textContent = Math.round(msToDisplaySpeed(avgMs));
    }
  }, 1000);

  /* ============ battery ============ */
  if('getBattery' in navigator){
    navigator.getBattery().then(function(batt){
      function update(){
        el.battChip.style.display = 'flex';
        el.battValue.textContent = Math.round(batt.level * 100) + '%';
      }
      update();
      batt.addEventListener('levelchange', update);
    }).catch(function(){});
  }

  /* ============ compass ============ */
  var CARDINALS = ['N','NE','E','SE','S','SW','W','NW'];
  function headingToCardinal(h){
    return CARDINALS[Math.round(h / 45) % 8];
  }
  function handleOrientation(e){
    var heading = e.webkitCompassHeading;
    if(heading == null && e.alpha != null) heading = 360 - e.alpha;
    if(heading == null) return;
    el.compassChip.textContent = Math.round(heading) + '° ' + headingToCardinal(heading);
  }
  function enableCompass(){
    var DOE = window.DeviceOrientationEvent;
    if(DOE && typeof DOE.requestPermission === 'function'){
      DOE.requestPermission().then(function(res){
        if(res === 'granted'){
          window.addEventListener('deviceorientation', handleOrientation, true);
          state.compassEnabled = true;
          el.compassBtn.textContent = 'Enabled';
        }
      }).catch(function(){});
    } else if(DOE){
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
      state.compassEnabled = true;
      el.compassBtn.textContent = 'Enabled';
    } else {
      el.compassChip.textContent = 'No compass sensor';
    }
  }

  /* ============ wake lock ============ */
  function requestWakeLock(){
    if(!state.wakeLockOn) return;
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(lock){
        wakeLock = lock;
      }).catch(function(){});
    }
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && state.wakeLockOn) requestWakeLock();
  });

  /* ============ theme ============ */
  function applyTheme(t){
    state.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('spoke_theme', t);
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    el.themeColorMeta.setAttribute('content', bg);
    updateSegmented(el.themeSeg, t);
  }

  /* ============ segmented control helper ============ */
  function updateSegmented(container, val){
    Array.prototype.forEach.call(container.children, function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-val') === val);
    });
  }

  /* ============ PWA manifest + service worker ============ */
  function setupPWA(){
    var icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314181A'/%3E%3Cpath d='M50 22a28 28 0 1 1 -19.8 47.8' stroke='%23FF6A3D' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23FF6A3D'/%3E%3C/svg%3E";
    var manifest = {
      name: 'Spoke — Bike Dashboard',
      short_name: 'Spoke',
      start_url: '.',
      display: 'standalone',
      background_color: '#14181A',
      theme_color: '#14181A',
      icons: [
        { src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
        { src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' }
      ]
    };
    try{
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));
    }catch(e){}

    try{
      if('serviceWorker' in navigator){
        var swSrc = "var CACHE='spoke-v1';" +
          "self.addEventListener('install',function(e){e.waitUntil(caches.open(CACHE).then(function(c){return c.add(self.registration.scope);}));self.skipWaiting();});" +
          "self.addEventListener('activate',function(e){self.clients.claim();});" +
          "self.addEventListener('fetch',function(e){e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request);}));});";
        var swBlob = new Blob([swSrc], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function(){});
      }
    }catch(e){}
  }

  /* ============ panel open/close ============ */
  function openPanel(){
    el.panel.classList.add('open');
    el.panel.setAttribute('aria-hidden', 'false');
    renderWorldClock();
    renderRideLog();
  }
  function closePanel(){
    el.panel.classList.remove('open');
    el.panel.setAttribute('aria-hidden', 'true');
  }

  /* ============ wire up events ============ */
  el.unitToggle.addEventListener('click', function(){
    state.unit = state.unit === 'km' ? 'mi' : 'km';
    localStorage.setItem('spoke_unit', state.unit);
    el.unitToggle.textContent = unitLabel();
    updateSegmented(el.unitSeg, state.unit);
    renderStats(ride.speedBuffer.length ? ride.speedBuffer[ride.speedBuffer.length-1] : 0);
  });

  el.timerBtn.addEventListener('click', toggleTimerManual);
  el.resetBtn.addEventListener('click', resetRide);
  el.moreBtn.addEventListener('click', openPanel);
  el.backBtn.addEventListener('click', closePanel);
  el.themeBtn.addEventListener('click', function(){ applyTheme(state.theme === 'dark' ? 'light' : 'dark'); });
  el.compassChip.addEventListener('click', enableCompass);
  el.compassBtn.addEventListener('click', enableCompass);

  el.unitSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    var v = btn.getAttribute('data-val');
    if(v !== state.unit){ state.unit = v; localStorage.setItem('spoke_unit', v); el.unitToggle.textContent = unitLabel(); updateSegmented(el.unitSeg, v); renderStats(0); renderRideLog(); }
  });
  el.clockSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    var v = btn.getAttribute('data-val');
    state.clockFormat = v;
    localStorage.setItem('spoke_clockformat', v);
    updateSegmented(el.clockSeg, v);
    renderClock(); renderWorldClock();
  });
  el.themeSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    applyTheme(btn.getAttribute('data-val'));
  });
  el.wakeSwitch.addEventListener('click', function(){
    state.wakeLockOn = !state.wakeLockOn;
    localStorage.setItem('spoke_wakelock', state.wakeLockOn ? 'on' : 'off');
    el.wakeSwitch.classList.toggle('on', state.wakeLockOn);
    if(state.wakeLockOn) requestWakeLock();
    else if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
  });

  /* ============ init ============ */
  function init(){
    el.unitToggle.textContent = unitLabel();
    updateSegmented(el.unitSeg, state.unit);
    updateSegmented(el.clockSeg, state.clockFormat);
    updateSegmented(el.themeSeg, state.theme);
    el.wakeSwitch.classList.toggle('on', state.wakeLockOn);

    renderClock();
    setInterval(renderClock, 1000);

    startGeo();
    setupPWA();
    if(state.wakeLockOn) requestWakeLock();
  }

  init();
})();
</script>
</body>
</html>
